[project]
name = "fitloop"
version = "0.1.0"
description = "每天陪你减脂的小工具：随口记，算额度，给建议"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "openai>=1.30",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "pydantic>=2.0",
]

# 这是个应用，不是库：不打包自己，uv 只负责装依赖
[tool.uv]
package = false
